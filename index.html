<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Mask Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .video-wrap {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video, canvas {
      border-radius: 12px;
      max-width: 95vw;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 12px; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Live Face Mask Detection</h2>
  <button id="startBtn" onclick="init()">Start Camera</button>
  <p id="status">Click "Start Camera" to initialize</p>

  <div class="video-wrap">
    <video id="video" autoplay playsinline muted style="display:none;"></video>
    <canvas id="output"></canvas>
  </div>

  <script>
    let maskModel = null;
    let faceDetector = null;
    const video = document.getElementById('video');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    async function init() {
      document.getElementById('startBtn').disabled = true;
      statusText.innerText = "Loading AI models...";

      try {
        faceDetector = await blazeface.load();
        maskModel = await tf.loadLayersModel('./web_model/model.json');

        statusText.innerText = "Requesting camera access...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          statusText.innerText = "Camera Active - Running Detection";
          detect();
        };
      } catch (err) {
        statusText.innerText = "Error: " + err.message;
        document.getElementById('startBtn').disabled = false;
      }
    }

    async function detect() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const predictions = await faceDetector.estimateFaces(video, false);

      for (let pred of predictions) {
        const start = pred.topLeft;
        const end = pred.bottomRight;
        const size = [end[0] - start[0], end[1] - start[1]];

        const x = Math.max(0, start[0]);
        const y = Math.max(0, start[1]);
        const width = Math.min(canvas.width - x, size[0]);
        const height = Math.min(canvas.height - y, size[1]);

        if (width > 20 && height > 20) {
          const faceTensor = tf.tidy(() => {
            let img = tf.browser.fromPixels(video);
            const boxes = [[y / canvas.height, x / canvas.width, (y + height) / canvas.height, (x + width) / canvas.width]];
            let cropped = tf.image.cropAndResize(img.expandDims(0), boxes, [0], [128, 128]);
            return cropped.div(255.0);
          });

          const prediction = await maskModel.predict(faceTensor).data();
          faceTensor.dispose();

          // Prediction threshold check
          const isMask = prediction.length > 1 ? prediction[0] > prediction[1] : prediction[0] > 0.5;
          const label = isMask ? "Mask" : "No Mask";
          const color = isMask ? "#22c55e" : "#ef4444";

          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, width, height);

          ctx.fillStyle = color;
          ctx.fillRect(x, y - 24, ctx.measureText(label).width + 16, 24);
          ctx.fillStyle = "#ffffff";
          ctx.font = "16px sans-serif";
          ctx.fillText(label, x + 8, y - 6);
        }
      }

      requestAnimationFrame(detect);
    }
  </script>
</body>
</html>
